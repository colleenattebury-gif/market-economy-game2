/* ===== specialization-core.css ===== */
/* Shared structural contract for progression-ui.js.
   Mission stylesheets own colors, typography, copy, and world identity. */

.spec-screen {
  --spec-accent: #66b3ff;
  --spec-highlight: #ffc766;
  --spec-success: #7ce6ba;
  --spec-danger: #ff9a8f;
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
  padding: clamp(24px, 4vw, 58px);
  color: #edf7f7;
  background:
    radial-gradient(circle at 50% 12%, rgba(102, 179, 255, .12), transparent 28%),
    linear-gradient(180deg, #0b1a28, #050c13 78%);
}

.spec-gridlines {
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: .2;
  background-image:
    linear-gradient(rgba(102, 179, 255, .08) 1px, transparent 1px),
    linear-gradient(90deg, rgba(102, 179, 255, .08) 1px, transparent 1px);
  background-size: 46px 46px;
  mask-image: linear-gradient(to bottom, black, transparent 86%);
}

.spec-hero {
  position: relative;
  z-index: 1;
  max-width: 1180px;
  margin: 0 auto 22px;
  padding: clamp(24px, 4vw, 42px);
  border: 1px solid rgba(102, 179, 255, .2);
  border-radius: 22px;
  background: rgba(9, 24, 38, .94);
  box-shadow: 0 28px 80px rgba(0, 0, 0, .3);
}

.spec-kicker {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 11px;
  border: 1px solid color-mix(in srgb, var(--spec-accent) 28%, transparent);
  border-radius: 999px;
  color: var(--spec-accent);
  font-size: 11px;
  font-weight: 900;
  letter-spacing: .18em;
}

.spec-hero h1 {
  font-family: Rajdhani, Inter, sans-serif;
  font-size: clamp(42px, 6vw, 78px);
  line-height: .94;
  margin: 18px 0 14px;
}

.spec-hero > p {
  max-width: 850px;
  color: #c7d5e1;
  font-size: 16px;
  line-height: 1.7;
}

.spec-rule {
  display: flex;
  gap: 18px;
  align-items: center;
  margin-top: 22px;
  padding: 14px 16px;
  border-left: 3px solid var(--spec-highlight);
  background: linear-gradient(90deg, rgba(255, 199, 102, .075), transparent);
}

.spec-rule span {
  color: var(--spec-highlight);
  font-size: 10px;
  font-weight: 900;
  letter-spacing: .16em;
  white-space: nowrap;
}

.spec-rule strong {
  color: #edf8f7;
  font-size: 13px;
}

.spec-grid {
  position: relative;
  z-index: 1;
  max-width: 1180px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 14px;
}

.spec-card {
  width: 100%;
  min-width: 0;
  min-height: 390px;
  position: relative;
  overflow: hidden;
  padding: 20px;
  color: #edf7f7;
  text-align: left;
  border: 1px solid rgba(102, 179, 255, .18);
  border-radius: 18px;
  background: linear-gradient(180deg, #10283b, #091926);
  cursor: pointer;
  transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
}

.spec-card:hover {
  transform: translateY(-3px);
  border-color: color-mix(in srgb, var(--spec-accent) 58%, transparent);
}

.spec-card.selected {
  border-color: var(--spec-highlight);
  box-shadow: 0 0 0 3px rgba(255, 199, 102, .1), 0 24px 54px rgba(0, 0, 0, .34);
}

.spec-card-top {
  display: flex;
  gap: 13px;
  align-items: center;
}

.spec-icon {
  flex: 0 0 auto;
  width: 48px;
  height: 48px;
  display: grid;
  place-items: center;
  border: 1px solid rgba(102, 179, 255, .18);
  border-radius: 14px;
  background: rgba(102, 179, 255, .08);
  font-size: 31px;
}

.spec-card small {
  color: #829aae;
  font-size: 9px;
  font-weight: 900;
  letter-spacing: .14em;
}

.spec-card h2 {
  margin: 4px 0 0;
  font-family: Rajdhani, Inter, sans-serif;
  font-size: 27px;
  line-height: 1;
}

.spec-card > p {
  min-height: 58px;
  color: #b4c6d4;
  font-size: 12px;
  line-height: 1.55;
}

.spec-level {
  margin: 18px 0 12px;
  padding: 11px 12px;
  border: 1px solid rgba(255, 199, 102, .14);
  border-radius: 11px;
  background: rgba(255, 199, 102, .04);
}

.spec-level span {
  display: block;
  color: var(--spec-highlight);
  font-size: 9px;
  font-weight: 900;
  letter-spacing: .13em;
}

.spec-level strong {
  display: block;
  margin-top: 4px;
  font-size: 13px;
}

.spec-strength,
.spec-vulnerability {
  margin-top: 9px;
  padding: 11px 12px;
  border-radius: 10px;
  font-size: 11px;
  line-height: 1.4;
}

.spec-strength {
  border: 1px solid rgba(124, 230, 186, .13);
  background: rgba(37, 111, 87, .14);
}

.spec-vulnerability {
  border: 1px solid rgba(255, 154, 143, .13);
  background: rgba(114, 55, 48, .13);
}

.spec-strength span,
.spec-vulnerability span {
  display: block;
  margin-bottom: 4px;
  font-size: 8px;
  font-weight: 900;
  letter-spacing: .13em;
}

.spec-strength span { color: var(--spec-success); }
.spec-vulnerability span { color: var(--spec-danger); }

.spec-tree {
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: 18px;
}

.spec-node {
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  border: 1px solid rgba(102, 179, 255, .2);
  border-radius: 50%;
  background: #0c2637;
  font: 800 11px Rajdhani, Inter, sans-serif;
}

.spec-node.active {
  border-color: var(--spec-highlight);
  color: var(--spec-highlight);
}

.spec-node.locked { opacity: .45; }
.spec-node small { display: none; }
.spec-line {
  width: 25px;
  height: 1px;
  background: rgba(102, 179, 255, .2);
}

.spec-selected-badge {
  position: absolute;
  top: 12px;
  right: 12px;
  padding: 7px 10px;
  border-radius: 999px;
  background: var(--spec-highlight);
  color: #161006;
  font-size: 10px;
  font-weight: 900;
  letter-spacing: .08em;
}

.spec-actions {
  position: sticky;
  z-index: 40;
  bottom: 12px;
  max-width: 1180px;
  margin: 20px auto 0;
  padding: 13px 15px 13px 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 18px;
  border: 1px solid rgba(102, 179, 255, .22);
  border-radius: 16px;
  background: rgba(6, 16, 25, .95);
  box-shadow: 0 -12px 40px rgba(0, 0, 0, .32);
  backdrop-filter: blur(14px);
}

.spec-action-copy {
  display: grid;
  gap: 3px;
  min-width: 0;
}

.spec-action-copy small {
  color: #7d93a6;
  font-size: 9px;
  font-weight: 900;
  letter-spacing: .15em;
}

.spec-action-copy strong {
  color: #f2f7fb;
  font-size: 17px;
}

.spec-commit {
  flex: 0 0 auto;
  min-width: 270px;
}

.spec-unlock {
  --spec-accent: #66b3ff;
  --spec-highlight: #ffc766;
  min-height: 100vh;
  position: relative;
  overflow: hidden;
  padding: 30px;
  display: grid;
  place-items: center;
  align-content: center;
  color: #edf7f7;
  text-align: center;
  background:
    radial-gradient(circle at center, rgba(255, 199, 102, .11), transparent 24%),
    radial-gradient(circle at center, rgba(102, 179, 255, .1), transparent 45%),
    #050d14;
}

.spec-unlock-ring {
  position: absolute;
  width: min(58vw, 680px);
  aspect-ratio: 1;
  border: 1px solid rgba(102, 179, 255, .16);
  border-radius: 50%;
  box-shadow:
    0 0 0 70px rgba(102, 179, 255, .015),
    0 0 0 140px rgba(255, 199, 102, .012);
  animation: specCorePulse 2.8s ease-in-out infinite;
}

.spec-unlock-icon {
  position: relative;
  font-size: 72px;
}

.spec-unlock-kicker {
  position: relative;
  margin-top: 12px;
  color: var(--spec-accent);
  font-size: 11px;
  font-weight: 900;
  letter-spacing: .2em;
}

.spec-unlock h1 {
  position: relative;
  margin: 14px 0;
  color: #f6fbfa;
  font: 700 clamp(54px, 9vw, 104px) / .88 Rajdhani, Inter, sans-serif;
}

.spec-unlock-level {
  position: relative;
  color: var(--spec-highlight);
  font-weight: 900;
  letter-spacing: .14em;
}

.spec-unlock-columns {
  position: relative;
  width: min(760px, 94vw);
  margin: 24px auto 16px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.spec-unlock-columns > div {
  padding: 18px;
  border: 1px solid rgba(102, 179, 255, .16);
  border-radius: 14px;
  background: rgba(9, 26, 40, .86);
  text-align: left;
}

.spec-unlock-columns span {
  display: block;
  color: var(--spec-accent);
  font-size: 9px;
  font-weight: 900;
  letter-spacing: .14em;
}

.spec-unlock-columns > div:last-child span { color: var(--spec-highlight); }

.spec-unlock-columns strong {
  display: block;
  margin-top: 6px;
  line-height: 1.45;
}

.spec-unlock > p {
  position: relative;
  margin: 0 0 22px;
  color: #a9bdcc;
}

.spec-unlock .primary { position: relative; }

@keyframes specCorePulse {
  0%, 100% { opacity: .58; transform: scale(.96); }
  50% { opacity: 1; transform: scale(1.03); }
}

@media (max-width: 1050px) {
  .spec-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .spec-card { min-height: 0; }
}

@media (max-width: 760px) {
  .spec-screen { padding: 22px 16px 110px; }
  .spec-grid { grid-template-columns: 1fr; }
  .spec-rule { align-items: flex-start; flex-direction: column; gap: 6px; }
  .spec-actions { align-items: stretch; flex-direction: column; }
  .spec-commit { width: 100%; min-width: 0; }
  .spec-unlock-columns { grid-template-columns: 1fr; }
}

@media (prefers-reduced-motion: reduce) {
  .spec-card { transition: none; }
  .spec-unlock-ring { animation: none; }
}

/* ===== trade-responsive-fix.css ===== */
/* Trade Phase responsive safety pass.
   Keeps the confirmation action fully visible on Chromebooks, tablets, and narrow windows. */

.trade-screen {
  overflow-x: hidden;
  overflow-y: auto;
  padding-bottom: 118px;
}

#tradeConfirm {
  position: relative;
  z-index: 40;
}

.trade-confirm {
  box-sizing: border-box;
  max-width: calc(100vw - 32px);
  left: 50%;
  right: auto;
  bottom: max(16px, env(safe-area-inset-bottom));
  transform: translateX(-50%);
}

.trade-confirm > div {
  min-width: 0;
  flex: 1 1 auto;
}

.trade-confirm strong,
.trade-confirm small {
  overflow-wrap: anywhere;
}

.trade-confirm .sign-deal {
  flex: 0 0 auto;
  min-width: 148px;
  white-space: nowrap;

@media (max-width: 1180px) {
  .trade-hero {
    grid-template-columns: 300px minmax(0, 1fr);
    padding: 24px;
  }

  .offers-panel {
    min-width: 0;
  }

    grid-template-columns: 1fr;
  }

    min-height: 0;
  }
}

  }

  }

  }

  }

  }

    flex-direction: column;
    align-items: stretch;
    gap: 12px;
    padding: 14px;
  }

    width: 100%;
    min-width: 0;
    min-height: 48px;
  }
}

    padding: 0 14px;
  }

  .trade-phase-tag {

  }

  .offers-panel,
  .envoy-panel {
    padding: 18px;
  }

  .offers-heading h2 {
    font-size: 34px;
  }
}

<script data-source="engine/mission-validator.js">
// Flashpoint mission contract validator.
// Runs before gameplay so malformed content packs fail loudly during authoring/testing.
(function(){
 const m=window.FLASHPOINT_MISSION;if(!m)return;
 const errors=[],warnings=[];const fail=msg=>errors.push(msg),warn=msg=>warnings.push(msg);
 if(!m.id)fail('Mission id is required.');if(!m.title)fail('Mission title is required.');if(!m.campaign)fail('Campaign is required.');
 if(!Number.isInteger(m.rounds)||m.rounds<1)fail('Mission rounds must be a positive integer.');
 if(!Array.isArray(m.scenarios))fail('Mission scenarios must be an array.');else{
  if(m.scenarios.length!==m.rounds)fail(`Scenario count (${m.scenarios.length}) must equal mission.rounds (${m.rounds}).`);
  m.scenarios.forEach((s,i)=>{const label=`Round ${i+1}`;if(!s.title)fail(`${label}: title is required.`);if(!s.briefing)warn(`${label}: briefing is empty.`);if(!Array.isArray(s.choices)||s.choices.length!==4)fail(`${label}: exactly four choices are required.`);(s.choices||[]).forEach((c,j)=>{if(!c.id)fail(`${label} choice ${j+1}: id is required.`);if(!c.label)fail(`${label} choice ${j+1}: label is required.`);if(!c.hint)warn(`${label} choice ${j+1}: hint is empty.`);if(!c.consequence)warn(`${label} choice ${j+1}: consequence is empty.`);});const words=`${s.scene||''} ${s.briefing||''}`.trim().split(/\s+/).filter(Boolean).length;if(words>145)warn(`${label}: required narrative is ${words} words; GDD target is normally 70–125 and should fit the student UI.`);});
 }
 const legacyCompact=new Set(['economics-shortage-002','world-trade-001','architecture-canary-001']);
 if(m.finalDecisionRound!==m.rounds)warn(`Final Decision should normally be Round ${m.rounds}.`);const final=m.scenarios?.[m.rounds-1];if(final&&!final.finalDecision)warn(`Round ${m.rounds} should be marked finalDecision: true.`);
 if(!legacyCompact.has(m.id)&&(m.rounds<10||m.rounds>12))warn(`New full Flashpoints normally use 10–12 major decisions; this mission declares ${m.rounds}.`);
 const resourceKeys=Object.keys(m.resources||{});if(!resourceKeys.length)fail('At least one mission resource is required.');resourceKeys.forEach(k=>{if(m.startingState?.[k]==null)warn(`Resource ${k} has no startingState value.`)});
 (m.advancementPhases||[]).forEach((p,i)=>{if(!Number.isInteger(p.afterRound)||p.afterRound<1||p.afterRound>=m.rounds)fail(`Advancement phase ${i+1}: afterRound must be between 1 and ${m.rounds-1}.`)});
 const result={valid:errors.length===0,errors,warnings,missionId:m.id};window.FLASHPOINT_VALIDATION=result;if(warnings.length)console.warn('[Flashpoint mission warnings]',warnings);if(errors.length){console.error('[Flashpoint mission invalid]',errors);document.addEventListener('DOMContentLoaded',()=>{const root=document.getElementById('app')||document.body;root.innerHTML=`<main style="min-height:100vh;display:grid;place-items:center;background:#07111b;color:#eef6ff;font-family:Inter,system-ui;padding:24px"><section style="max-width:760px;padding:28px;border:1px solid #8d3940;border-radius:18px;background:#111b25"><div style="color:#ff8e95;font-weight:900;letter-spacing:.12em;font-size:11px">FLASHPOINT CONTENT VALIDATION FAILED</div><h1>${m.title||'Mission'}</h1><p>This content pack cannot start until its contract errors are fixed.</p><ul>${errors.map(e=>`<li>${e}</li>`).join('')}</ul></section></main>`;});throw new Error(`Invalid Flashpoint mission: ${errors.join(' | ')}`);}
})();
</script>
<script data-source="engine/mission-adapter.js">
// Flashpoint reusable mission adapter.
// Transitional compatibility layer: lets legacy missions run while new missions
// provide their own resource metadata and shell copy.
(function(){
  const mission = window.FLASHPOINT_MISSION;
  if (!mission) throw new Error('FLASHPOINT_MISSION must load before mission-adapter.js');

  const legacyResources = {
    credits: { label:'Treasury', icon:'💰', prefix:'$', suffix:'M', min:null, max:null, meterMax:1000, help:'Money available for long-term investments and the consequences of major decisions.', criticalBelow:0, warnBelow:400 },
    food: { label:'Food Security', icon:'🌾', prefix:'', suffix:'%', min:0, max:100, help:'How secure the nation’s food supply is.', criticalBelow:20, warnBelow:50 },
    stability: { label:'Stability', icon:'⚖', prefix:'', suffix:'%', min:0, max:100, help:'Public confidence and national calm.', criticalBelow:20, warnBelow:50 },
    jobs: { label:'Jobs', icon:'⚙', prefix:'', suffix:'%', min:0, max:100, help:'Overall employment strength.', criticalBelow:25, warnBelow:50 },
    trade: { label:'Trade', icon:'↗', prefix:'', suffix:'%', min:0, max:100, help:'Strength of trade relationships and access to foreign goods.', criticalBelow:25, warnBelow:50 }
  };

  if (!mission.entity) mission.entity = { type:'nation', name:mission.nation || 'Your Nation', studentRole:'Leader' };
  if (!mission.resources) mission.resources = legacyResources;
  if (!mission.shellCopy) mission.shellCopy = {};

  mission.shellCopy = {
    decisionPrompt: 'MAKE THE CALL',
    decisionSupport: 'All four options are available. Choose the trade-off you can live with.',
    lockDecision: 'LOCK DECISION ⚡',
    selectDecision: 'SELECT A DECISION',
    intelligenceLabel: 'FIELD INTELLIGENCE',
    consequenceConceptLabel: 'CONCEPT DISCOVERED',
    advancementCurrencyKey: 'credits',
    advancementSkipLabel: 'SAVE RESOURCES // SKIP',
    advancementBuildLabel: 'BUILD ADVANCEMENT',
    ...mission.shellCopy
  };

  window.FlashpointMission = {
    resourceMeta: mission.resources,
    entity: mission.entity,
    copy: mission.shellCopy,
    formatResource(key, value) {
      const meta = mission.resources[key] || {};
      const rounded = Math.round(value ?? 0);
      return `${meta.prefix || ''}${rounded}${meta.suffix || ''}`;
    },
    meterPercent(key, value) {
      const meta = mission.resources[key] || {};
      if (Number.isFinite(meta.meterMax) && meta.meterMax > 0) return Math.max(0, Math.min(100, (value / meta.meterMax) * 100));
      const min = Number.isFinite(meta.min) ? meta.min : 0;
      const max = Number.isFinite(meta.max) ? meta.max : 100;
      if (max <= min) return 100;
      return Math.max(0, Math.min(100, ((value - min) / (max - min)) * 100));
    },
    meterClass(key, value) {
      const meta = mission.resources[key] || {};
      const critical = Number.isFinite(meta.criticalBelow) ? meta.criticalBelow : 25;
      const warn = Number.isFinite(meta.warnBelow) ? meta.warnBelow : 50;
      return value < critical ? 'danger' : value < warn ? 'warn' : 'good';
    },
    clampResource(key, value) {
      const meta = mission.resources[key] || {};
      let next = value;
      if (Number.isFinite(meta.min)) next = Math.max(meta.min, next);
      if (Number.isFinite(meta.max)) next = Math.min(meta.max, next);
      return next;
    }
  };
})();

</script>
<script data-source="app.js">
const app = document.getElementById('app');
const mission = window.FLASHPOINT_MISSION;
const fpMission = window.FlashpointMission;

const spendKey = mission.shellCopy?.advancementCurrencyKey || 'credits';
const trackLowestKey = mission.tracking?.lowestResourceKey || (mission.startingState.credits != null ? 'credits' : null);

const state = {
  screen: 'intro', round: 0, resources: { ...mission.startingState }, selectedChoice: null,
  pendingEffects: [], decisions: [], intelOpen: false, achievementUnlocked: false,
  advancements: [], selectedAdvancement: null, advancementPhaseIndex: null,
  completedAdvancementRounds: [], passiveEffects: [], events: [],
  lowestTreasury: trackLowestKey ? mission.startingState[trackLowestKey] : null
};

// Transitional public names retained because the current cinematic/finale layers consume them.
// Source of truth is now mission configuration via engine/mission-adapter.js.
const resourceMeta = fpMission?.resourceMeta || mission.resources || {};

const clamp = (v, min = 0, max = 100) => Math.max(min, Math.min(max, v));
const fmt = (key, value) => fpMission?.formatResource ? fpMission.formatResource(key, value) : `${Math.round(value)}%`;

function applyEffects(effects = {}) {
  Object.entries(effects).forEach(([key, delta]) => {
    if (!(key in state.resources)) return;
    state.resources[key] += delta;
    if (!['xp','level'].includes(key)) {
      state.resources[key] = fpMission?.clampResource ? fpMission.clampResource(key, state.resources[key]) : state.resources[key];
    }
  });
  if (trackLowestKey && state.resources[trackLowestKey] != null) {
    state.lowestTreasury = state.lowestTreasury == null
      ? state.resources[trackLowestKey]
      : Math.min(state.lowestTreasury, state.resources[trackLowestKey]);
  }
}

function scheduleDelayed(source, delayed) {
  if (!delayed) return;
  state.pendingEffects.push({ source, triggerRound: state.round + delayed.afterRound, ...delayed });
}

function processDelayed() {
  const due = state.pendingEffects.filter(e => e.triggerRound === state.round);
  state.pendingEffects = state.pendingEffects.filter(e => e.triggerRound !== state.round);
  due.forEach(e => { applyEffects(e.effects || {}); state.events.push({ type:'trigger', title:e.news, cause:e.cause || `A previous decision — ${e.source} — changed what happened next.` }); });
  return due;
}

function effectText(key, val) {
  const meta = resourceMeta[key] || {};
  const abs = Math.abs(val);
  return `${meta.label || key} ${val >= 0 ? '+' : '−'}${fmt(key, abs)}`;
}

function applyPassives() {
  const summaries = [];
  state.passiveEffects.forEach(p => {
    applyEffects(p.effects);
    const bits = Object.entries(p.effects).map(([key,val]) => effectText(key,val));
    summaries.push(`${p.name}: ${bits.join(', ')}`);
  });
  return summaries;
}

function addXp(amount) {
  state.resources.xp += amount;
  const next = 1 + Math.floor(state.resources.xp / 400);
  const leveled = next > state.resources.level;
  state.resources.level = next;
  return leveled;
}

function missionFailed() {
  if (Array.isArray(mission.failureConditions) && mission.failureConditions.length) {
    return mission.failureConditions.some(rule => {
      const value = state.resources[rule.resource];
      if (value == null) return false;
      if (rule.below != null && value < rule.below) return true;
      if (rule.atOrBelow != null && value <= rule.atOrBelow) return true;
      if (rule.above != null && value > rule.above) return true;
      if (rule.atOrAbove != null && value >= rule.atOrAbove) return true;
      return false;
    });
  }
  // Legacy Shortage compatibility until its mission content is migrated to the new contract.
  return !!mission.thresholds && (
    state.resources.food < mission.thresholds.foodCritical ||
    state.resources.stability < mission.thresholds.stabilityCritical ||
    state.resources.credits < mission.thresholds.creditsCritical
  );
}

function meterClass(key, value) {
  return fpMission?.meterClass ? fpMission.meterClass(key, value) : (value < 25 ? 'danger' : value < 50 ? 'warn' : 'good');
}

function header() {
  const pct = Math.round((state.round / mission.rounds) * 100);
  return `<header class="topbar"><div class="brand"><span class="brand-bolt">⚡</span> FLASHPOINT</div><div class="campaign">${mission.campaign.toUpperCase()} // ${mission.title.toUpperCase()}</div><div class="profile"><span>LVL ${state.resources.level}</span><strong>${state.resources.xp} XP</strong><button class="fullscreen-btn" onclick="toggleFullscreen()" title="Full Screen">⛶</button></div></header>
  <div class="mission-strip"><button class="objective-chip" onclick="toggleObjective()">🎯 <span>${mission.objective}</span></button><div class="progress-wrap"><div class="progress-label">DECISION ${Math.min(state.round + 1, mission.rounds)} / ${mission.rounds}</div><div class="progress"><i style="width:${pct}%"></i></div></div></div>`;
}

function resourcesPanel(compact = false) {
  return `<section class="resources ${compact ? 'compact' : ''}">${Object.entries(resourceMeta).filter(([key]) => state.resources[key] != null).map(([key,m]) => {
    const v = state.resources[key];
    const width = fpMission?.meterPercent ? fpMission.meterPercent(key,v) : clamp(v);
    return `<button class="resource-card" onclick="showHelp('${key}')"><div class="resource-head"><span>${m.icon || '◆'} ${m.label || key}</span><b>${fmt(key,v)}</b></div><div class="meter"><i class="${meterClass(key,v)}" style="width:${width}%"></i></div></button>`;
  }).join('')}</section>`;
}

function advancementSummary() {
  if (!state.advancements.length) return '';
  return `<section class="owned-advancements"><div class="owned-title">ACTIVE ADVANCEMENTS</div>${state.advancements.map(a => `<div class="owned-chip ${a.rarity}"><span>${a.icon}</span><strong>${a.name}</strong><small>${a.rarity.toUpperCase()}</small></div>`).join('')}</section>`;
}

function renderIntro() {
  const introResources = Object.entries(resourceMeta).filter(([key]) => state.resources[key] != null).slice(0,3);
  app.innerHTML = `<main class="intro-screen"><div class="intro-glow"></div><div class="intro-card"><div class="kicker">${mission.intro?.kicker || 'FLASHPOINT DETECTED'}</div><h1>${mission.title}</h1><p class="subtitle">${mission.subtitle}</p><div class="objective-box"><span>🎯 YOUR MISSION</span><strong>${mission.objective}</strong></div><div class="starting-grid">${introResources.map(([key,m])=>`<div><small>${(m.label || key).toUpperCase()}</small><b>${fmt(key, mission.startingState[key])}</b></div>`).join('')}</div><div class="success-note">${mission.successSummary || `Survive all ${mission.rounds} decisions and protect the resources your mission depends on.`}</div><button class="primary huge" onclick="startMission()">BEGIN FLASHPOINT <span>⚡</span></button></div></main>`;
}

function renderScenario() {
  const scenario = mission.scenarios[state.round];
  const due = processDelayed();
  const passive = applyPassives();
  const copy = mission.shellCopy || {};
  app.innerHTML = `${header()}<main class="command-shell">${resourcesPanel()}${advancementSummary()}
  ${due.length ? due.map(d => `<div class="trigger-event"><span>⚠ CONSEQUENCE TRIGGERED</span><strong>${d.news}</strong><small>${d.cause || ''}</small></div>`).join('') : ''}
  ${passive.length ? `<div class="passive-update"><span>⚡ ADVANCEMENT PAYOFF</span><strong>${passive.join(' • ')}</strong></div>` : ''}
  <section class="scenario-grid"><article class="briefing-panel"><div class="eyebrow">${scenario.eyebrow}</div><h1>${scenario.title}</h1><p class="scene-set">${scenario.scene || ''}</p><p>${scenario.briefing}</p><button class="intel-btn" onclick="toggleIntel()">▣ ${state.intelOpen ? 'HIDE' : 'OPEN'} INTELLIGENCE</button>${state.intelOpen ? `<div class="intel-panel"><div class="intel-title">${copy.intelligenceLabel || 'FIELD INTELLIGENCE'}</div>${scenario.intel.map(i=>`<p>• ${i}</p>`).join('')}</div>`:''}</article>
  <section class="decision-panel"><div class="decision-title"><span>${copy.decisionPrompt || 'MAKE THE CALL'}</span><small>${copy.decisionSupport || 'All four options are available. Choose the trade-off you can live with.'}</small></div><div class="choices">${scenario.choices.map((c,i)=>choiceCard(c,i)).join('')}</div><button class="primary lock" ${state.selectedChoice?'':'disabled'} onclick="lockDecision()">${state.selectedChoice?(copy.lockDecision || 'LOCK DECISION ⚡'):(copy.selectDecision || 'SELECT A DECISION')}</button></section></section></main>`;
}

function choiceCard(choice, idx) {
  const selected = state.selectedChoice === choice.id;
  // Major scenario decisions are intentionally NEVER gated by current resources.
  // Any financial/resource impact is applied only after the student commits.
  const impactPreview = choice.preview || choice.strategyTag || '';
  return `<button class="choice ${selected?'selected':''}" onclick="selectChoice('${choice.id}')"><div class="choice-index">${String.fromCharCode(65+idx)}</div><div class="choice-copy"><strong>${choice.label}</strong><span class="choice-hint">${choice.hint}</span><p>${choice.detail || ''}</p></div>${impactPreview?`<div class="choice-cost">${impactPreview}</div>`:''}</button>`;
}

function renderConsequence(choice,before,leveled) {
  const changed = Object.keys(choice.effects||{}).filter(k=>k!=='xp' && resourceMeta[k]);
  const copy = mission.shellCopy || {};
  app.innerHTML = `${header()}<main class="consequence-screen"><div class="decision-locked">DECISION LOCKED</div><h1>${choice.label}</h1><p class="consequence-copy">${choice.consequence}</p><div class="delta-grid">${changed.map(key=>{const delta=state.resources[key]-before[key],m=resourceMeta[key];return `<div class="delta ${delta>=0?'up':'down'}"><span>${m?.icon||''} ${m?.label||key}</span><strong>${delta>=0?'+':'−'}${fmt(key,Math.abs(delta))}</strong></div>`}).join('')}</div><div class="why-box"><span>WHY?</span><p>${choice.consequence}</p><div class="concept">${copy.consequenceConceptLabel || 'CONCEPT DISCOVERED'} // <b>${choice.concept}</b></div></div><div class="xp-pop">+125 XP</div>${leveled?`<div class="level-up">⚡ LEVEL UP // LEVEL ${state.resources.level}</div>`:''}${state.achievementUnlocked?`<div class="achievement"><span>🏆 ACHIEVEMENT UNLOCKED</span><strong>PRESSURE TESTED</strong><small>Complete three major crisis decisions.</small></div>`:''}<button class="primary" onclick="continueMission()">${nextAdvancementPhase()?'ENTER ADVANCEMENT PHASE':state.round>=mission.rounds-1?'VIEW FINAL DEBRIEF':'CONTINUE'} →</button></main>`;
}

function nextAdvancementPhase(){ return mission.advancementPhases?.find((p,i)=>p.afterRound===state.round&&!state.completedAdvancementRounds.includes(i)); }
function advancementAvailable(o){
  if(state.advancements.some(a=>a.id===o.id)) return false;
  if(o.cost != null && state.resources[spendKey] != null && state.resources[spendKey] < o.cost) return false;
  if (!o.requirement) return true;
  return Object.entries(o.requirement).every(([rule,value]) => {
    if (!rule.startsWith('min')) return true;
    const rawKey = rule.slice(3);
    const key = rawKey.charAt(0).toLowerCase()+rawKey.slice(1);
    return state.resources[key] == null || state.resources[key] >= value;
  });
}
function requirementText(o){
  if(!o.requirement)return'';
  return Object.entries(o.requirement).filter(([rule])=>rule.startsWith('min')).map(([rule,value])=>{
    const rawKey=rule.slice(3), key=rawKey.charAt(0).toLowerCase()+rawKey.slice(1), m=resourceMeta[key];
    return `${m?.label || key} ${fmt(key,value)}+`;
  }).join(' • ');
}

function renderAdvancementPhase(){
  const phase=mission.advancementPhases[state.advancementPhaseIndex];
  const copy = mission.shellCopy || {};
  app.innerHTML=`${header()}<main class="advancement-screen"><section class="advancement-hero"><div class="kicker">ADVANCEMENT PHASE UNLOCKED</div><h1>${phase.title}</h1><p>${phase.briefing}</p></section>${resourcesPanel(true)}${advancementSummary()}<section class="advancement-grid">${phase.options.map(advancementCard).join('')}</section><div class="advancement-actions"><button class="secondary" onclick="skipAdvancement()">${copy.advancementSkipLabel || 'SAVE RESOURCES // SKIP'}</button><button class="primary" ${state.selectedAdvancement?'':'disabled'} onclick="purchaseAdvancement()">${state.selectedAdvancement?(copy.advancementBuildLabel || 'BUILD ADVANCEMENT'):'SELECT AN ADVANCEMENT'} ⚡</button></div></main>`;
}

function advancementCard(o){
  const available=advancementAvailable(o), selected=state.selectedAdvancement===o.id, req=requirementText(o);
  return `<button class="advancement-card ${o.rarity} ${selected?'selected':''} ${!available?'locked':''}" ${!available?'disabled':''} onclick="selectAdvancement('${o.id}')"><div class="rarity">${o.rarity.toUpperCase()}</div><div class="adv-icon">${o.icon}</div><h3>${o.name}</h3><div class="adv-cost">${fmt(spendKey,o.cost)}</div><p>${o.summary}</p><div class="perk"><span>PERK</span>${o.perk}</div><div class="tradeoff"><span>TRADE-OFF</span>${o.tradeoff}</div>${req?`<div class="requirement">REQUIRES // ${req}</div>`:''}</button>`;
}

function renderAdvancementResult(o){
  const spendMeta=resourceMeta[spendKey] || {label:'Resources'};
  app.innerHTML=`${header()}<main class="advancement-result"><div class="kicker">ADVANCEMENT COMPLETE</div><div class="adv-result-icon ${o.rarity}">${o.icon}</div><div class="rarity ${o.rarity}">${o.rarity.toUpperCase()}</div><h1>${o.name}</h1><p>${o.summary}</p><div class="perk large"><span>LONG-TERM EFFECT</span>${o.perk}</div><div class="reserve-after">${spendMeta.label.toUpperCase()} <strong>${fmt(spendKey,state.resources[spendKey])}</strong></div><button class="primary" onclick="finishAdvancement()">RETURN TO CRISIS →</button></main>`;
}

function renderDebrief(){
  // Legacy fallback debrief. The cinematic finale layer currently overrides this for The Shortage.
  const failed=missionFailed();
  const title=failed?'CRISIS CASCADE':'MISSION SURVIVOR';
  const summary=failed?'A critical mission threshold was crossed. Your journey shows where the system broke under pressure.':'You reached the end with a strategy that kept the mission moving through the crisis.';
  const tracked=trackLowestKey && resourceMeta[trackLowestKey];
  app.innerHTML=`${header()}<main class="debrief-screen"><div class="kicker">MISSION DEBRIEF</div><h1>${failed?'MISSION CRITICAL':'CRISIS SURVIVED'}</h1><div class="legacy-card"><small>${mission.finale?.legacyLabel || 'YOUR LEGACY'}</small><strong>${title}</strong><p>${summary}</p></div>${resourcesPanel()}<section class="debrief-highlights"><div><small>DECISIONS</small><strong>${state.decisions.length}</strong></div><div><small>${tracked?`LOWEST ${tracked.label.toUpperCase()}`:'CAUSE & EFFECT EVENTS'}</small><strong>${tracked?fmt(trackLowestKey,state.lowestTreasury):state.events.length}</strong></div><div><small>ADVANCEMENTS</small><strong>${state.advancements.length}</strong></div></section>${advancementSummary()}<section class="journey"><h2>YOUR DECISION JOURNEY</h2>${state.decisions.map((d,i)=>`<div><span>${String(i+1).padStart(2,'0')}</span><strong>${d.label}</strong><small>${d.concept}</small></div>`).join('')}</section>${state.events.length?`<section class="event-history"><h2>CAUSE & EFFECT MOMENTS</h2>${state.events.map(e=>`<div><span>⚡</span><strong>${e.title}</strong><small>${e.cause}</small></div>`).join('')}</section>`:''}<div class="debrief-actions"><button class="secondary" onclick="restartMission()">REPLAY MISSION</button><button class="primary" onclick="alert('Command Center arrives in the next build.')">RETURN TO COMMAND CENTER</button></div></main>`;
}

function startMission(){state.screen='scenario';renderScenario();}
function selectChoice(id){state.selectedChoice=id;renderScenario();}
function toggleIntel(){state.intelOpen=!state.intelOpen;renderScenario();}
function lockDecision(){const scenario=mission.scenarios[state.round],choice=scenario.choices.find(c=>c.id===state.selectedChoice);if(!choice)return;const before={...state.resources};applyEffects(choice.effects);scheduleDelayed(choice.label,choice.delayed);state.decisions.push({round:state.round+1,label:choice.label,concept:choice.concept,effects:{...(choice.effects||{})}});const leveled=addXp(125);state.achievementUnlocked=state.decisions.length===3;renderConsequence(choice,before,leveled);}
function continueMission(){const phase=nextAdvancementPhase();if(phase){state.advancementPhaseIndex=mission.advancementPhases.indexOf(phase);state.selectedAdvancement=null;renderAdvancementPhase();return;}if(state.round>=mission.rounds-1){renderDebrief();return;}state.round++;state.selectedChoice=null;state.intelOpen=false;renderScenario();}
function selectAdvancement(id){state.selectedAdvancement=id;renderAdvancementPhase();}
function purchaseAdvancement(){const phase=mission.advancementPhases[state.advancementPhaseIndex],o=phase.options.find(x=>x.id===state.selectedAdvancement);if(!o||!advancementAvailable(o))return;applyEffects(o.immediate);if(o.passive)state.passiveEffects.push({name:o.name,effects:o.passive});if(o.delayed)scheduleDelayed(o.name,o.delayed);state.advancements.push(o);state.completedAdvancementRounds.push(state.advancementPhaseIndex);state.events.push({type:'advancement',title:`${o.name} built`,cause:'You chose a long-term investment instead of keeping those resources available.'});renderAdvancementResult(o);}
function skipAdvancement(){state.completedAdvancementRounds.push(state.advancementPhaseIndex);state.advancementPhaseIndex=null;finishAdvancement();}
function finishAdvancement(){state.advancementPhaseIndex=null;state.selectedAdvancement=null;if(state.round>=mission.rounds-1){renderDebrief();return;}state.round++;state.selectedChoice=null;state.intelOpen=false;renderScenario();}
function restartMission(){Object.assign(state,{screen:'intro',round:0,resources:{...mission.startingState},selectedChoice:null,pendingEffects:[],decisions:[],intelOpen:false,achievementUnlocked:false,advancements:[],selectedAdvancement:null,advancementPhaseIndex:null,completedAdvancementRounds:[],passiveEffects:[],events:[],lowestTreasury:trackLowestKey?mission.startingState[trackLowestKey]:null});renderIntro();}
function toggleObjective(){alert(`YOUR MISSION\n\n${mission.objective}\n\n${mission.successSummary || `Complete all ${mission.rounds} decisions and protect the resources your mission depends on.`}`);}
function showHelp(key){const m=resourceMeta[key];if(!m)return;alert(`${(m.label||key).toUpperCase()}\n\n${m.help || 'This resource helps define the condition of your mission.'}`);}
function toggleFullscreen(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.();}

renderIntro();

</script>
<script data-source="engine/runtime-bridge.js">

</script>

// Flashpoint progression policy: generic XP/player levels/achievements are legacy-only.

 if(!window.FLASHPOINT_MISSION)return;
 const legacy=window.FLASHPOINT_MISSION.id==='economics-shortage-002';
 if(legacy)return;
 const baseHeader=window.header;
 if(typeof baseHeader==='function')window.header=function(){
   const html=baseHeader.apply(this,arguments);
   return html.replace(/<div class="profile"><span>LVL[\s\S]*?<button class="fullscreen-btn"/,'<div class="profile"><button class="fullscreen-btn"');
 };
 window.addXp=function(){return false;};
 const baseConsequence=window.renderConsequence;
 if(typeof baseConsequence==='function')window.renderConsequence=function(){

   document.querySelectorAll('.xp-pop,.level-up,.achievement').forEach(el=>el.remove());

 };
 state.achievementUnlocked=false;

<script data-source="engine-rules-v3.js">
// Flashpoint shared decision rules.
// Major scenario choices are never resource-gated. Dedicated progression systems
// may spend campaign-specific resources defined by mission configuration.

const decisionResourceKey = mission.shellCopy?.advancementCurrencyKey || Object.keys(resourceMeta).find(key => state.resources[key] != null);
if (decisionResourceKey && resourceMeta[decisionResourceKey]) {
  const meta = resourceMeta[decisionResourceKey];

}

</script>
<script data-source="experience-v4.js">
// Flashpoint cinematic experience layer: mission launch, payoff screens, and event takeovers.

state.eventQueue = state.eventQueue || [];
state.processedPassiveRounds = state.processedPassiveRounds || [];
state.resumeAfterEvent = state.resumeAfterEvent || null;
const legacyMetaProgression = mission.id === 'economics-shortage-002';

function experienceCopy() {
  return {
    entityName: mission.entity?.name || mission.nation || 'Your Nation',
    introKicker: mission.intro?.kicker || `FLASHPOINT DETECTED // ${mission.campaign.toUpperCase()}`,
    introLead: mission.intro?.lead || mission.subtitle || 'A major crisis is unfolding. The decisions are yours.',
    introAction: mission.intro?.actionLabel || 'TAKE COMMAND ⚡',
    visualHeader: mission.intro?.visual?.header || 'LIVE CRISIS INTELLIGENCE',
    visualStatus: mission.intro?.visual?.status || 'CRISIS LEVEL // HIGH',
    tickerLabel: mission.intro?.tickerLabel || 'FLASHPOINT NEWS',
    tickerText: mission.intro?.tickerText || mission.subtitle || '',
    consequenceKicker: mission.shellCopy?.consequenceKicker || `YOUR CALL CHANGED ${mission.entity?.name?.toUpperCase() || 'THE SITUATION'}`,
    intelligenceLabel: mission.shellCopy?.intelligenceLabel || 'FIELD INTELLIGENCE',
    decisionPrompt: mission.shellCopy?.decisionPrompt || 'MAKE THE CALL',
    decisionSupport: mission.shellCopy?.decisionSupport || 'All four options are available. Choose the trade-off you can live with.',
    lockDecision: mission.shellCopy?.lockDecision || 'LOCK DECISION ⚡',
    selectDecision: mission.shellCopy?.selectDecision || 'SELECT A DECISION',
    conceptLabel: mission.shellCopy?.consequenceConceptLabel || 'CONCEPT DISCOVERED'
  };
}

function effectCards(effects = {}) {
  return Object.entries(effects).filter(([key, value]) => value !== 0 && resourceMeta[key]).map(([key, value]) => {
    const good = value > 0;
    return `<div class="event-impact ${good ? 'positive' : 'negative'}"><span>${resourceMeta[key].icon} ${resourceMeta[key].label}</span><strong>${good ? '+' : '−'}${fmt(key, Math.abs(value))}</strong></div>`;
  }).join('');
}

function renderGenericIntroVisual() {
  const visual = mission.intro?.visual || {};
  const readouts = Array.isArray(visual.readouts) && visual.readouts.length
    ? visual.readouts
    : Object.entries(resourceMeta).filter(([key]) => mission.startingState[key] != null).slice(0,4).map(([key,meta]) => ({label:meta.label,value:fmt(key,mission.startingState[key]),caption:'starting condition'}));
  return `<aside class="briefing-visual crisis-board">
    <div class="visual-header"><span>${visual.header || 'LIVE CRISIS INTELLIGENCE'}</span><b>${visual.status || 'CRISIS LEVEL // HIGH'}</b></div>
    <div class="intel-visual generic-intel-visual">
      <div class="radar-rings"></div><div class="radar-sweep"></div>
      <div class="drought-core"><small>${visual.coreLabel || 'MISSION STATUS'}</small><strong>${visual.coreValue || 'ACTIVE'}</strong><span>${visual.coreCaption || mission.entity?.name || mission.title}</span></div>
    </div>
    <div class="crisis-readouts">${readouts.map(r=>`<div><small>${r.label}</small><strong>${r.value}</strong><span>${r.caption || ''}</span></div>`).join('')}</div>
    <div class="news-ticker"><span>${mission.intro?.tickerLabel || 'FLASHPOINT NEWS'}</span><p>${mission.intro?.tickerText || mission.subtitle || ''}</p></div>
  </aside>`;
}

function renderIntro() {
  const copy = experienceCopy();
  const themeClass = mission.theme ? `theme-${mission.theme}` : 'theme-default';
  const missionClass = mission.id ? `mission-${mission.id}` : '';
  app.innerHTML = `<main class="briefing-screen ${themeClass} ${missionClass}">
    <div class="briefing-gridlines"></div>
    <section class="briefing-copy">
      <div class="kicker">${copy.introKicker}</div>
      <div class="nation-tag">${copy.entityName.toUpperCase()}</div>
      <h1>${mission.title}</h1>
      <p class="briefing-lead">${copy.introLead}</p>
      <div class="objective-box mission-brief"><span>🎯 YOUR MISSION</span><strong>${mission.objective}</strong></div>
      <div class="briefing-actions"><button class="primary huge" onclick="startMission()">${copy.introAction}</button><button class="secondary" onclick="toggleFullscreen()">⛶ FULL SCREEN</button></div>
    </section>
    ${renderGenericIntroVisual()}
  </main>`;
}

function queueTriggeredEvents(due, passiveSummaries) {
  due.forEach(d => state.eventQueue.push({
    tone: Object.values(d.effects || {}).some(v => v < 0) ? 'danger' : 'success',
    eyebrow: Object.values(d.effects || {}).some(v => v < 0) ? 'CONSEQUENCE TRIGGERED' : 'PAYOFF TRIGGERED',
    title: d.news || 'A previous decision changes the situation.',
    cause: d.cause || `Your earlier choice — ${d.source} — changed what happened next.`,
    source: d.source,
    effects: d.effects || {}
  }));
  passiveSummaries.forEach(p => state.eventQueue.push({
    tone: 'success', eyebrow: 'ADVANCEMENT PAYOFF', title: p.summary,
    cause: `Your ${p.name} advancement is still producing benefits.`, source: p.name, effects: p.effects
  }));
}

function applyPassivesOnce() {
  if (state.processedPassiveRounds.includes(state.round)) return [];
  state.processedPassiveRounds.push(state.round);
  return state.passiveEffects.map(p => {
    applyEffects(p.effects);
    return { name: p.name, effects: p.effects, summary: `${p.name} is still paying off.` };
  });
}

function scenarioMarkup() {
  const scenario = mission.scenarios[state.round];
  const copy = experienceCopy();
  return `${header()}<main class="command-shell">${resourcesPanel()}${advancementSummary()}
  <section class="scenario-grid"><article class="briefing-panel"><div class="eyebrow">${scenario.eyebrow}</div><h1>${scenario.title}</h1><p class="scene-set">${scenario.scene || ''}</p><p>${scenario.briefing}</p><button class="intel-btn" onclick="toggleIntel()">▣ ${state.intelOpen ? 'HIDE' : 'OPEN'} INTELLIGENCE</button>${state.intelOpen ? `<div class="intel-panel"><div class="intel-title">${copy.intelligenceLabel}</div>${scenario.intel.map(i=>`<p>• ${i}</p>`).join('')}</div>`:''}</article>
  <section class="decision-panel"><div class="decision-title"><span>${copy.decisionPrompt}</span><small>${copy.decisionSupport}</small></div><div class="choices">${scenario.choices.map((c,i)=>choiceCard(c,i)).join('')}</div><button class="primary lock" ${state.selectedChoice?'':'disabled'} onclick="lockDecision()">${state.selectedChoice?copy.lockDecision:copy.selectDecision}</button></section></section></main>`;
}

function renderScenario() {
  const due = processDelayed();
  const passive = applyPassivesOnce();
  if (due.length || passive.length) {
    queueTriggeredEvents(due, passive);
    state.resumeAfterEvent = 'scenario';
    return renderEventTakeover();
  }
  app.innerHTML = scenarioMarkup();
}

function renderEventTakeover() {
  const event = state.eventQueue[0];
  if (!event) return resumeFromEvents();
  const danger = event.tone === 'danger';
  app.innerHTML = `<main class="event-takeover ${danger ? 'event-danger' : 'event-success'}">

 function marketPosition(){const s=window.state;if(!s?.resources)return'PRE-LAUNCH';const r=s.resources;if(r.cash<15)return'CASH DANGER';if(r.demand>=70&&r.capacity<45)return'ORDERS OUTRUNNING YOU';if(r.reputation>=70)return'BRAND HEAT';if(r.resilience>=65)return'SHOCK READY';if(r.demand>=60)return'GROWING FAST';if(r.team<30)return'TEAM UNDER PRESSURE';return'BUILDING MOMENTUM'}
 function companyPulse(){if(!context||!window.state?.resources)return'';const r=state.resources;return `<section class="company-pulse"><div class="pulse-identity"><span>${context.icon}</span><div><small>YOUR COMPANY</small><strong>${safe(context.companyName)}</strong></div></div><div class="pulse-stat"><small>CASH</small><b>$${Math.round(r.cash)}K</b></div><div class="pulse-stat"><small>DEMAND</small><b>${Math.round(r.demand)}%</b></div><div class="pulse-stat"><small>CAPACITY</small><b>${Math.round(r.capacity)}%</b></div><div class="pulse-stat"><small>TEAM</small><b>${Math.round(r.team)}%</b></div><div class="pulse-position"><small>MARKET POSITION</small><b>${marketPosition()}</b></div></section>`}

 function marketReaction(choice,before){if(!context||!window.state?.resources)return;const target=document.querySelector('.consequence-screen,.consequence-stage');if(!target||target.querySelector('.market-reaction'))return;const after=state.resources,changes=[];[['demand','CUSTOMERS'],['reputation','BRAND'],['team','WORKERS'],['capacity','OPERATIONS'],['cash','CASH']].forEach(([key,label])=>{const d=Math.round((after[key]??0)-(before?.[key]??after[key]??0));if(Math.abs(d)>=4)changes.push({label,d})});changes.sort((a,b)=>Math.abs(b.d)-Math.abs(a.d));const primary=changes[0];let headline='THE MARKET IS WATCHING';let text='Your choice changed the trade-offs facing your company.';if(primary){if(primary.label==='CUSTOMERS')text=primary.d>0?'More customers are interested in what you are selling.':'Some customers are pulling back after your decision.';if(primary.label==='BRAND')text=primary.d>0?'Your brand is gaining trust and attention.':'Your reputation took a hit in the market.';if(primary.label==='WORKERS')text=primary.d>0?'Your team is stronger and more willing to deliver.':'Your workers are feeling the pressure.';if(primary.label==='OPERATIONS')text=primary.d>0?'Your company can handle more business now.':'Your operation is struggling to keep up.';if(primary.label==='CASH')text=primary.d>0?'This move put more cash behind your company.':'This move used cash you may need later.';headline=`${primary.label} ${primary.d>0?'RESPOND':'PUSH BACK'}`}

(function(){

 window.selectBoardroomForecast=function(checkId,key){const check=(m.boardroomChecks||[]).find(c=>c.id===checkId),option=check?.options.find(o=>o.key===key);if(!option)return;state.selectedBoardroomForecast=key;document.querySelectorAll('.boardroom-option').forEach(x=>x.classList.toggle('selected',x.dataset.key===key));const label=document.getElementById('boardroomSelection'),btn=document.getElementById('boardroomLock');if(label)label.textContent=`${option.icon} ${option.label} is my biggest concern.`;if(btn){btn.disabled=false;btn.textContent=`LOCK ${option.label} FORECAST ⚡`;}};
 window.lockBoardroomForecast=function(checkId){const check=(m.boardroomChecks||[]).find(c=>c.id===checkId),option=check?.options.find(o=>o.key===state.selectedBoardroomForecast);if(!check||!option)return;const record={id:check.id,afterRound:check.afterRound,key:option.key,label:option.label,icon:option.icon,snapshot:resourceSnapshot()};state.boardroomChecks.push(record);state.selectedBoardroomForecast=null;window.dispatchEvent(new CustomEvent('flashpoint:boardroom-locked',{detail:record}));document.getElementById('app').innerHTML=`<main class="boardroom-lock-screen"><div class="boardroom-lock-ring"></div><div class="boardroom-lock-icon">${option.icon}</div><div class="boardroom-kicker">FORECAST LOCKED // ${esc(window.FLASHPOINT_CONTEXT?.companyName||'YOUR COMPANY')}</div><h1>YOU'RE WATCHING<br>${option.label}.</h1><p>${esc(option.copy)}</p><div class="boardroom-watch"><span>DON'T CHANGE YOUR ANSWER.</span><strong>Now watch the next decisions and see whether your read of the business was right.</strong></div><button class="primary huge" onclick="continueAfterBoardroom()">BACK TO BUSINESS →</button></main>`;};

 function closeResumePrompt(){const el=document.getElementById('fpResumePrompt');if(el)el.remove();if(lastFocus&&document.contains(lastFocus))lastFocus.focus()}
 function showResumePrompt(saved){
  const snap=saved.snapshot,spec=snap.specialization,done=saved.decisionCount||snap.decisions?.length||0;
  lastFocus=document.activeElement;
  const overlay=document.createElement('div');overlay.className='fp-resume-backdrop';overlay.id='fpResumePrompt';
  overlay.innerHTML='<div class="fp-resume-card" role="dialog" aria-modal="true" aria-labelledby="fpResumeTitle"><small>SAVED GAME FOUND ON THIS COMPUTER</small><h2 id="fpResumeTitle" tabindex="-1">Welcome back'+(snap.missionContext?.companyName?', '+esc(snap.missionContext.companyName):'')+'.</h2><div class="fp-resume-meta"><div><small>DECISIONS</small><strong>'+done+' / '+mission.rounds+'</strong></div><div><small>'+esc(mission.specializations?.label||'SPECIALIZATION')+'</small><strong>'+esc(spec?spec.pathName+' • LVL '+spec.level:'Not chosen yet')+'</strong></div><div><small>TRAITS</small><strong>'+(snap.traits?.length||0)+'</strong></div></div><div class="fp-resume-actions"><button type="button" onclick="fpStartFreshRun()">START OVER</button><button type="button" class="primary" onclick="fpResumeSavedRun()">RESUME ⚡</button></div></div>';
  document.body.appendChild(overlay);
  overlay.querySelector('#fpResumeTitle').focus();
  overlay.addEventListener('keydown',e=>{if(e.key==='Escape')closeResumePrompt()});
 }

 function wrap(name,after){const original=window[name];if(typeof original!=='function')return;window[name]=function(...args){const result=original.apply(this,args);try{after(...args)}catch(err){console.error(err)}return result}}
 wrap('startMission',()=>checkpoint('decision_1'));
 wrap('lockDecision',()=>checkpoint(state?.round===mission?.rounds-1?'final_decision':'decision_locked'));
 wrap('purchaseAdvancement',()=>checkpoint('advancement'));
 wrap('skipAdvancement',()=>checkpoint('advancement_skipped'));
 wrap('finalizeSpecialization',()=>checkpoint('specialization'));
 wrap('finalizeSpecializationBranch',()=>checkpoint('specialization_branch'));
 wrap('advanceProgressionReveal',()=>checkpoint('progression'));
 wrap('commitInterstitial',()=>checkpoint('interstitial'));
 wrap('declineInterstitial',()=>checkpoint('interstitial'));
 window.addEventListener('flashpoint:boardroom-locked',()=>checkpoint('thinking_checkpoint'));
 // Offline the finale has exactly one way out: replay from the very beginning. The hosted
 // build offered a command-center exit that does not exist here (and only alerted "arrives in
 // a future build"), so remove it outright rather than leave two similar restarts side by side.
 function retargetExitButtons(){
  const actions=document.querySelector('.final-actions,.debrief-actions');if(!actions)return;
  let replay=null;
  actions.querySelectorAll('button').forEach(button=>{
   const inline=button.getAttribute('onclick')||'',text=button.textContent||'';
   if(/command center/i.test(text)||/command center/i.test(inline)){button.remove();return}
   if(/replay/i.test(text))replay=button;
  });
  actions.classList.add('fp-offline-actions'); // one button, so centre it rather than hang it right
  if(!replay)return;
  replay.removeAttribute('onclick');
  replay.className='primary';
  replay.textContent='REPLAY FLASHPOINT ⚡';
  replay.onclick=()=>window.fpStartFreshRun(); // clears the save and the company, back to the picker
 }
 wrap('renderDebrief',()=>{
  checkpoint('complete',{status:'completed'});
  document.getElementById('fpSaveState')?.remove(); // nothing left to save; keep the finale clean
  retargetExitButtons();
  // Finale layers stage the results, so re-apply once the screen has settled.
  setTimeout(retargetExitButtons,600);
 });

 const saved=read(RUN_KEY);
 if(saved?.status==='in_progress'&&saved?.snapshot&&saved.missionId===mission.id)setTimeout(()=>showResumePrompt(saved),120);
 else if(saved?.status==='completed')drop(RUN_KEY);
})();

</script>
